<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoply — E-commerce Mobile App</title>
<style>
:root{--ink:#20231f;--forest:#245c45;--mint:#e5f3ea;--cream:#faf8f3;--white:#fff;--muted:#70766f;--border:#e4e7e1;--coral:#d9674f;--shadow:0 12px 35px #20231f12}
*{box-sizing:border-box}body{margin:0;background:#f0f1ed;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #518b70;outline-offset:2px}
header{background:var(--cream);border-bottom:1px solid var(--border);padding:16px 22px;position:sticky;top:0;z-index:5}.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px;color:var(--forest);border:0;background:none;padding:0}.brand span{color:var(--coral)}.searchtop{flex:1;display:flex;gap:8px}.searchtop input{width:100%;background:white;border:1px solid var(--border);border-radius:99px;padding:12px 16px}.topbtn{border:1px solid var(--border);background:white;border-radius:99px;padding:10px 13px;color:var(--ink)}main{max-width:1100px;margin:22px auto 100px;padding:0 20px}.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:24px}.side{background:var(--cream);border:1px solid var(--border);border-radius:18px;padding:14px;height:max-content;position:sticky;top:90px}.side h3{margin:5px 9px 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.navbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:12px 10px;color:var(--ink);font-weight:650;margin:2px 0}.navbtn.active,.navbtn:hover{background:var(--mint);color:var(--forest)}.navbtn .emoji{width:22px;text-align:center}.count{margin-left:auto;background:var(--forest);color:white;border-radius:99px;padding:1px 7px;font-size:11px}.screen-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 0 20px}.screen-head h1{font-size:30px;line-height:1.15;letter-spacing:-.8px;margin:0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--forest);margin:0 0 5px}.sub{color:var(--muted);margin:6px 0 0}.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:245px;overflow:hidden;border-radius:22px;background:var(--mint);margin-bottom:26px}.hero-copy{padding:30px;align-self:center}.hero h2{font-size:34px;line-height:1.12;letter-spacing:-1px;margin:8px 0 12px;max-width:360px}.hero p{color:#43594a;max-width:350px}.hero-art{display:grid;place-items:center;font-size:100px;background:radial-gradient(circle at 50% 50%,#fff8 0 28%,transparent 29%),linear-gradient(140deg,#d0e9d8,#a7d3b5)}.btn{border:0;border-radius:99px;padding:12px 18px;min-height:46px;font-weight:750;background:var(--forest);color:white}.btn.secondary{background:white;color:var(--forest);border:1px solid var(--border)}.btn.ghost{background:transparent;color:var(--forest);border:1px solid var(--border)}.btn.danger{background:#fff0ec;color:#9c3928}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.section-title h2{font-size:20px;margin:0}.linkbtn{border:0;background:transparent;color:var(--forest);font-weight:750;padding:8px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cat{border:1px solid var(--border);background:var(--cream);border-radius:16px;padding:18px 10px;text-align:center;font-weight:700}.cat span{display:block;font-size:30px;margin-bottom:7px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{border:1px solid var(--border);background:white;border-radius:17px;padding:10px;min-width:0;position:relative}.prod-art{height:145px;border-radius:12px;display:grid;place-items:center;font-size:58px;background:var(--art,#e5f3ea)}.prod-title{font-weight:700;margin:10px 0 3px}.price{font-weight:850;font-size:17px}.oldprice{color:var(--muted);font-size:12px;text-decoration:line-through;margin-left:5px}.rating{font-size:12px;color:#88622b}.heart{position:absolute;right:16px;top:16px;border:0;border-radius:50%;width:36px;height:36px;background:#ffffffed;font-size:18px}.pill{display:inline-block;background:var(--mint);color:var(--forest);padding:4px 9px;border-radius:99px;font-size:11px;font-weight:800}.panel{background:white;border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:750}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #cdd3ca;border-radius:11px;background:white;color:var(--ink)}.field small{color:var(--muted)}.detail{display:grid;grid-template-columns:1fr 1fr;gap:22px}.detail-art{min-height:340px;border-radius:20px;background:var(--mint);display:grid;place-items:center;font-size:130px}.detail h2{font-size:28px;line-height:1.2;margin:8px 0}.detail .price{font-size:24px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:36px;height:36px;border:1px solid var(--border);border-radius:50%;background:white}.cartrow{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.cartart{height:78px;border-radius:12px;background:var(--art,var(--mint));display:grid;place-items:center;font-size:36px}.summaryline{display:flex;justify-content:space-between;gap:12px;margin:10px 0}.total{font-size:20px;font-weight:850;border-top:1px solid var(--border);padding-top:14px;margin-top:14px}.empty{text-align:center;padding:42px 20px;background:white;border:1px dashed #cdd3ca;border-radius:18px}.empty .big{font-size:55px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filter{border:1px solid var(--border);background:white;border-radius:99px;padding:8px 13px}.filter.active{background:var(--forest);color:white;border-color:var(--forest)}.order{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{font-size:12px;background:var(--mint);color:var(--forest);font-weight:800;padding:5px 9px;border-radius:99px}.settingrow{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--border)}.settingrow:last-child{border:0}.switch{width:44px;height:25px;accent-color:var(--forest)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;border-radius:99px;box-shadow:var(--shadow);z-index:20;max-width:90vw}.mobile-nav{display:none}
@media(max-width:800px){header{padding:12px}.top{gap:10px;flex-wrap:wrap}.brand{font-size:23px}.searchtop{order:3;flex-basis:100%}.topbtn{padding:9px 11px}.layout{display:block}.side{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--cream);border-top:1px solid var(--border);justify-content:space-around;padding:8px 4px env(safe-area-inset-bottom)}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}.mobile-nav button span{font-size:20px}.mobile-nav button.active{color:var(--forest);font-weight:800}main{padding:0 14px;margin-top:17px}.hero{grid-template-columns:1fr}.hero-copy{padding:23px}.hero h2{font-size:29px}.hero-art{display:none}.cats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.prod-art{height:120px}.screen-head h1{font-size:26px}.detail{grid-template-columns:1fr}.detail-art{min-height:230px;font-size:100px}.grid2{grid-template-columns:1fr}.panel{padding:15px}.cartrow{grid-template-columns:60px 1fr auto;gap:9px}.cartart{height:60px}.cartrow .btn{padding:8px 10px}}
@media(min-width:801px){.mobile-nav{display:none}}
</style></head><body>
<header><div class="top"><button class="brand" data-screen="home" aria-label="Shoply home">shoply<span>.</span></button><form class="searchtop" id="topSearch"><input id="globalSearch" aria-label="Search products" placeholder="Search products, brands and more"><button class="topbtn" type="submit" aria-label="Search">⌕</button></form><button class="topbtn" data-screen="wishlist" aria-label="Wishlist">♡ Saved</button><button class="topbtn" data-screen="cart" aria-label="Shopping cart">Bag <span id="headCount">0</span></button></div></header>
<main><div class="layout"><aside class="side"><h3>Shop</h3><div id="desktopNav"></div><div class="panel" style="padding:14px;margin-top:16px;background:var(--mint);border:0"><b>Good things, thoughtfully picked.</b><p class="muted">Easy shopping for everyday living.</p></div></aside><section id="view" aria-live="polite"></section></div></main>
<nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"></nav><div id="toast" class="toast" role="status" hidden></div>
<script>
const products=[
{id:1,name:"Everyday Canvas Tote",price:24,old:32,cat:"Accessories",emoji:"👜",art:"#f1e5d4",rating:"4.8",tag:"Bestseller",desc:"A durable everyday tote with roomy storage and a clean, timeless shape."},
{id:2,name:"Ceramic Coffee Set",price:38,old:null,cat:"Home",emoji:"☕",art:"#e5e8d8",rating:"4.9",tag:"Popular",desc:"A tactile ceramic set made for slow mornings and daily rituals."},
{id:3,name:"Soft Knit Throw",price:46,old:58,cat:"Home",emoji:"🧶",art:"#eadbd3",rating:"4.7",tag:"Sale",desc:"A cosy, textured throw that adds warmth to your favourite corner."},
{id:4,name:"Daily Journal",price:18,old:null,cat:"Stationery",emoji:"📓",art:"#dce8f1",rating:"4.6",tag:"New",desc:"A simple undated journal for notes, plans and small ideas."},
{id:5,name:"Steel Water Bottle",price:29,old:null,cat:"Accessories",emoji:"🧴",art:"#d5e9df",rating:"4.8",tag:"Bestseller",desc:"A reusable bottle designed to travel from desk to weekend walk."},
{id:6,name:"Desk Light",price:54,old:65,cat:"Home",emoji:"💡",art:"#f2e7c9",rating:"4.5",tag:"Sale",desc:"A warm, adjustable light for focused work and relaxed evenings."},
{id:7,name:"Wireless Earbuds",price:69,old:null,cat:"Tech",emoji:"🎧",art:"#e2e0f1",rating:"4.7",tag:"Popular",desc:"Compact everyday audio with a comfortable fit and charging case."},
{id:8,name:"Everyday Sneakers",price:78,old:null,cat:"Fashion",emoji:"👟",art:"#e8e8e4",rating:"4.8",tag:"New",desc:"Versatile, lightweight sneakers for everyday city exploring."}
];
const categories=[["Home","🏡"],["Fashion","👟"],["Accessories","👜"],["Tech","🎧"],["Stationery","📓"]];
let current="home", selected=products[0], cart={}, wishlist=new Set([3,5]), searchQuery="", filter="All",toastTimer;
const money=n=>"$"+Number(n).toFixed(2);
const byId=id=>products.find(p=>p.id===Number(id));
function notify(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2400)}
function countCart(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function subtotal(){return Object.entries(cart).reduce((sum,[id,q])=>sum+byId(id).price*q,0)}
function nav(){const items=[["home","⌂","Home"],["categories","▦","Categories"],["orders","▤","Orders"],["profile","◉","Profile"],["settings","⚙","Settings"]];document.getElementById("desktopNav").innerHTML=items.map(([id,ic,l])=>'<button class="navbtn '+(current===id?'active':'')+'" data-screen="'+id+'"><span class="emoji">'+ic+'</span>'+l+'</button>').join("");document.getElementById("mobileNav").innerHTML=items.map(([id,ic,l])=>'<button class="'+(current===id?'active':'')+'" data-screen="'+id+'"><span>'+ic+'</span>'+l+'</button>').join("");document.getElementById("headCount").textContent=countCart();bindNav()}
function bindNav(){document.querySelectorAll("[data-screen]").forEach(b=>b.onclick=()=>go(b.dataset.screen));}
function go(id){current=id;render()}
function productCards(list){if(!list.length)return '<div class="empty"><div class="big">⌕</div><h3>No products found</h3><p class="sub">Try a different search or remove a filter.</p><button class="btn secondary" data-action="clearSearch">Clear search</button></div>';return '<div class="products">'+list.map(p=>'<article class="product" style="--art:'+p.art+'"><button class="heart" data-action="heart" data-id="'+p.id+'" aria-label="'+(wishlist.has(p.id)?"Remove from":"Add to")+' wishlist">'+(wishlist.has(p.id)?"♥":"♡")+'</button><div class="prod-art" data-action="product" data-id="'+p.id+'" role="button" tabindex="0" aria-label="View '+p.name+'">'+p.emoji+'</div><div class="prod-title" data-action="product" data-id="'+p.id+'" role="button" tabindex="0">'+p.name+'</div><div class="rating">★ '+p.rating+' · '+p.tag+'</div><div class="price">'+money(p.price)+(p.old?'<span class="oldprice">'+money(p.old)+'</span>':'')+'</div><button class="btn secondary action" data-action="product" data-id="'+p.id+'">View details</button></article>').join("")+'</div>'}
function heading(kicker,title,sub=""){return '<div class="screen-head"><div><p class="eyebrow">'+kicker+'</p><h1>'+title+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div></div>'}
function home(){return heading("Made for everyday","Find your next favourite","Thoughtful essentials for the little things in life.")+'<section class="hero"><div class="hero-copy"><span class="pill">THE EVERYDAY EDIT</span><h2>Good design. Better days.</h2><p>Discover useful, lovely things that fit your everyday.</p><button class="btn" data-screen="categories">Explore the collection →</button></div><div class="hero-art" aria-hidden="true">🛍️</div></section><div class="section-title"><h2>Shop by category</h2><button class="linkbtn" data-screen="categories">View all →</button></div><div class="cats">'+categories.slice(0,4).map(([c,e])=>'<button class="cat" data-action="category" data-cat="'+c+'"><span>'+e+'</span>'+c+'</button>').join("")+'</div><div class="section-title"><h2>Customer favourites</h2><button class="linkbtn" data-screen="search">Discover more →</button></div>'+productCards(products.slice(0,3))+'<div class="panel" style="margin-top:22px;background:var(--mint)"><h3>Little perks, thoughtfully packed</h3><p class="sub">Free standard shipping on sample orders over $50 · Easy 30-day returns</p></div>'}
function categoryPage(){return heading("Explore","Categories","Find something for every corner of your day.")+'<div class="cats">'+categories.map(([c,e])=>'<button class="cat" data-action="category" data-cat="'+c+'"><span>'+e+'</span>'+c+'<small class="muted" style="display:block;margin-top:4px">'+products.filter(p=>p.cat===c).length+' items</small></button>').join("")+'</div><div class="section-title"><h2>Popular right now</h2></div>'+productCards(products.slice(0,4))}
function detail(){const p=selected;return '<button class="linkbtn" data-screen="home">← Continue shopping</button><div class="detail"><div class="detail-art" style="background:'+p.art+'" aria-label="'+p.name+' illustration">'+p.emoji+'</div><div><p class="eyebrow">'+p.cat+'</p><h2>'+p.name+'</h2><div class="rating">★ '+p.rating+' · Reviews from happy shoppers</div><p class="price" style="margin:14px 0">'+money(p.price)+(p.old?'<span class="oldprice">'+money(p.old)+'</span>':'')+'</p><span class="pill">'+p.tag+'</span><p>'+p.desc+'</p><div class="panel" style="padding:13px"><b>✓ Ready to ship</b><p class="muted">Estimated delivery in 3–5 business days. Free shipping over $50.</p></div><button class="btn" style="width:100%" data-action="add" data-id="'+p.id+'">Add to bag · '+money(p.price)+'</button><button class="btn secondary" style="width:100%;margin-top:9px" data-action="heart" data-id="'+p.id+'">'+(wishlist.has(p.id)?"♥ Saved to wishlist":"♡ Add to wishlist")+'</button><p class="muted">Secure checkout · 30-day returns</p></div></div>'}
function cartPage(){const entries=Object.entries(cart);if(!entries.length)return heading("Your bag","Shopping cart","Your next favourite might be waiting.")+'<div class="empty"><div class="big">🛍️</div><h2>Your bag is taking a break</h2><p class="sub">Add something lovely and it will appear here.</p><button class="btn" data-screen="home">Start shopping</button></div>';return heading("Almost yours","Your bag","Review your items before checkout.")+'<div class="grid2"><div class="panel">'+entries.map(([id,q])=>{const p=byId(id);return '<div class="cartrow"><div class="cartart" style="--art:'+p.art+'">'+p.emoji+'</div><div><b>'+p.name+'</b><div class="price">'+money(p.price)+'</div><div class="qty" style="margin-top:7px"><button data-action="qty" data-id="'+id+'" data-delta="-1" aria-label="Decrease quantity">−</button><span>'+q+'</span><button data-action="qty" data-id="'+id+'" data-delta="1" aria-label="Increase quantity">+</button></div></div><button class="linkbtn" data-action="remove" data-id="'+id+'">Remove</button></div>'}).join("")+'</div><div class="panel"><h3>Order summary</h3><div class="summaryline"><span>Subtotal</span><b>'+money(subtotal())+'</b></div><div class="summaryline"><span>Shipping</span><span>'+(subtotal()>=50?'Free':'$5.00')+'</span></div><div class="summaryline total"><span>Total</span><span>'+money(subtotal()+(subtotal()>=50?0:5))+'</span></div><p class="muted">Taxes calculated at checkout. Sample prices.</p><button class="btn" style="width:100%" data-screen="checkout">Continue to checkout →</button><button class="btn secondary" style="width:100%;margin-top:8px" data-screen="home">Keep shopping</button></div></div>'}
function checkout(){if(!countCart())return cartPage();return heading("Secure checkout","Delivery details","This demo will not process a real payment.")+'<div class="grid2"><form class="panel" id="checkoutForm"><h3>Contact information</h3><div class="field"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"></div><h3>Delivery address</h3><div class="field"><label for="fullname">Full name</label><input id="fullname" required autocomplete="name" placeholder="Full name"></div><div class="field"><label for="address">Street address</label><input id="address" required autocomplete="street-address" placeholder="Street and number"></div><div class="grid2"><div class="field"><label for="city">City</label><input id="city" required autocomplete="address-level2"></div><div class="field"><label for="postcode">Postal code</label><input id="postcode" required autocomplete="postal-code"></div></div><div class="field"><label for="delivery">Delivery option</label><select id="delivery"><option>Standard · 3–5 days · Free over $50</option><option>Express · 1–2 days · $9.00</option></select></div><h3>Payment</h3><div class="panel" style="background:var(--cream);padding:12px"><span>🔒</span> Demo checkout — no card details are requested or charged.</div><button class="btn" type="submit" style="width:100%">Place demo order</button></form><div class="panel"><h3>Order summary</h3>'+Object.entries(cart).map(([id,q])=>'<div class="summaryline"><span>'+byId(id).name+' × '+q+'</span><b>'+money(byId(id).price*q)+'</b></div>').join("")+'<div class="summaryline"><span>Subtotal</span><b>'+money(subtotal())+'</b></div><div class="summaryline"><span>Shipping</span><span>'+(subtotal()>=50?'Free':'$5.00')+'</span></div><div class="summaryline total"><span>Total</span><span>'+money(subtotal()+(subtotal()>=50?0:5))+'</span></div></div></div>'}
function profile(){return heading("Your space","Profile","Keep your shopping details close at hand.")+'<div class="panel" style="display:flex;gap:16px;align-items:center"><div style="font-size:42px;background:var(--mint);border-radius:50%;padding:12px">🙂</div><div><h2 style="margin:0">Hello, shopper</h2><p class="sub">Sign in to sync your details across devices.</p><button class="btn secondary" data-action="demoSignIn">Demo sign in</button></div></div><div class="panel">'+[["orders","▤","Your orders","Track deliveries and see order history"],["wishlist","♡","Wishlist","Saved items you love"],["settings","⚙","Settings","Preferences and privacy"],["categories","▦","Browse categories","Find your next favourite"]].map(([id,ic,t,d])=>'<button class="navbtn" data-screen="'+id+'"><span class="emoji">'+ic+'</span><span><b>'+t+'</b><br><small class="muted">'+d+'</small></span><span style="margin-left:auto">›</span></button>').join("")+'</div>'}
function orders(){return heading("Your purchases","Orders","A clear overview of your recent shopping.")+'<div class="panel"><div class="order"><div><b>Order #SH-1048</b><p class="muted">Placed 12 Oct · 2 items · '+money(62)+'</p></div><span class="status">Delivered</span></div><div class="row"><span class="muted">Everyday Canvas Tote · Ceramic Coffee Set</span><button class="linkbtn" data-action="orderDetails">Details</button></div></div><div class="panel"><div class="order"><div><b>Order #SH-1031</b><p class="muted">Placed 28 Sep · 1 item · '+money(29)+'</p></div><span class="status" style="background:#f8ebcf;color:#76551d">In transit</span></div><div class="row"><span class="muted">Steel Water Bottle</span><button class="linkbtn" data-action="orderDetails">Track order</button></div></div><div class="panel"><p class="muted">These are example orders for the prototype, not real purchases.</p></div>'}
function searchPage(){let list=products.filter(p=>(p.name+" "+p.cat+" "+p.desc).toLowerCase().includes(searchQuery.toLowerCase())&&(filter==="All"||p.cat===filter));return heading("Find your thing","Search","Search the collection and filter by category.")+'<form id="searchForm" class="searchtop" style="margin-bottom:10px"><input id="pageSearch" aria-label="Search the collection" value="'+escapeHtml(searchQuery)+'" placeholder="Try “ceramic” or “accessories”"><button class="btn" type="submit">Search</button></form><div class="filters">'+["All",...categories.map(c=>c[0])].map(c=>'<button class="filter '+(filter===c?'active':'')+'" data-action="filter" data-filter="'+c+'">'+c+'</button>').join("")+'</div><p class="muted">'+list.length+' products found</p>'+productCards(list)}
function wishlistPage(){const list=products.filter(p=>wishlist.has(p.id));return heading("Saved for later","Your wishlist","Keep your favourites all in one place.")+(list.length?productCards(list):'<div class="empty"><div class="big">♡</div><h2>No saved items yet</h2><p class="sub">Tap the heart on a product to save it here.</p><button class="btn" data-screen="home">Discover products</button></div>')}
function settings(){return heading("Make it yours","Settings","Choose how Shoply fits your day.")+'<div class="panel"><h3>Notifications</h3><div class="settingrow"><div><b>Order updates</b><div class="muted">Delivery and order status messages</div></div><input class="switch" type="checkbox" checked aria-label="Order updates"></div><div class="settingrow"><div><b>New arrivals</b><div class="muted">Hear about new collections</div></div><input class="switch" type="checkbox" aria-label="New arrivals"></div><div class="settingrow"><div><b>Offers and inspiration</b><div class="muted">Occasional product picks and offers</div></div><input class="switch" type="checkbox" aria-label="Offers and inspiration"></div></div><div class="panel"><h3>Privacy & support</h3><button class="navbtn" data-action="help">ⓘ Help centre <span style="margin-left:auto">›</span></button><button class="navbtn" data-action="privacy">♧ Privacy information <span style="margin-left:auto">›</span></button><button class="navbtn" data-action="display">Aa Display preferences <span style="margin-left:auto">›</span></button></div><div class="panel"><h3>About Shoply</h3><p class="muted">Prototype v1.0 · Built as a Week 2 UX design exercise.</p></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){nav();const views={home,categories:categoryPage,product:detail,cart:cartPage,checkout,profile,orders,search:searchPage,wishlist:wishlistPage,settings};document.getElementById("view").innerHTML=(views[current]||home)();bindNav();document.querySelectorAll("[data-action]").forEach(el=>{const run=()=>action(el.dataset.action,el);el.addEventListener("click",run);if(el.getAttribute("role")==="button")el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();run()}})});const topInput=document.getElementById("globalSearch");topInput.value=searchQuery;document.getElementById("topSearch").onsubmit=e=>{e.preventDefault();searchQuery=topInput.value.trim();current="search";render()};const sf=document.getElementById("searchForm");if(sf)sf.onsubmit=e=>{e.preventDefault();searchQuery=document.getElementById("pageSearch").value.trim();render()};const cf=document.getElementById("checkoutForm");if(cf)cf.onsubmit=e=>{e.preventDefault();const orderId="SH-"+Math.floor(2000+Math.random()*7000);cart={};current="confirmation";renderConfirmation(orderId);};}
function renderConfirmation(id){nav();document.getElementById("view").innerHTML=heading("Order demo","You're all set!","Your sample checkout has been completed.")+'<div class="empty"><div class="big">✓</div><h2>Thank you for trying Shoply</h2><p class="sub">Demo reference '+id+'. No real order or payment was created.</p><button class="btn" data-screen="home">Back to home</button></div>';bindNav();document.querySelectorAll("[data-screen]").forEach(b=>b.onclick=()=>go(b.dataset.screen))}
function action(a,el){const id=Number(el.dataset.id);switch(a){case"product":selected=byId(id);go("product");break;case"heart":if(wishlist.has(id)){wishlist.delete(id);notify("Removed from wishlist")}else{wishlist.add(id);notify("Saved to wishlist")}render();break;case"add":cart[id]=(cart[id]||0)+1;notify("Added to your bag");render();break;case"qty":cart[id]=Math.max(0,(cart[id]||0)+Number(el.dataset.delta));if(!cart[id])delete cart[id];render();break;case"remove":delete cart[id];notify("Item removed");render();break;case"category":filter=el.dataset.cat;searchQuery="";go("search");break;case"filter":filter=el.dataset.filter;render();break;case"clearSearch":searchQuery="";filter="All";render();break;case"demoSignIn":notify("Sign-in is not connected in this demo");break;case"orderDetails":notify("Sample order: tracking is not connected");break;case"help":notify("Demo help centre — no external service connected");break;case"privacy":notify("Demo privacy information: no personal data is stored");break;case"display":document.body.classList.toggle("large-text");document.body.style.fontSize=document.body.classList.contains("large-text")?"18px":"";notify("Display preference preview toggled");break}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-screen]");if(b&&b.dataset.screen){e.preventDefault();go(b.dataset.screen)}});
render();
</script></body></html>
